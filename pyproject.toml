[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hzbot"
version = "0.1.0"
description = "Bot do automatycznej gry w Hero Zero"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.28", "PyYAML>=6.0"]

[project.optional-dependencies]
capture = ["playwright>=1.40"]
dev = ["pytest>=7"]

[project.scripts]
hzbot = "hzbot.cli:main"

[tool.setuptools]
packages = ["hzbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
